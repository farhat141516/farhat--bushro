<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Подача заявки на обучение в медресе Ал Бушра." />
    <title>Регистрация — Ал Бушра</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="page-header registration-header">
      <div class="registration-header__copy">
        <p>Приём заявок в медресе «Ал Бушра»</p>
        <h2>Начните путь к знаниям</h2>
      </div>
    </header>
    <main class="inner-page container">
      <p class="eyebrow">Регистрация ученика</p>
      <h1>Оставьте заявку</h1>
      <p class="lead">Заполните форму, и мы свяжемся с вами, чтобы рассказать о программе и ответить на вопросы.</p>
      <form class="application-form standalone-form" id="application-form" novalidate>
        <div class="honeypot" aria-hidden="true">
          <label for="website">Не заполняйте это поле</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
        </div>
        <div class="form-grid">
          <div class="field full-width">
            <label for="student-name">ФИО ученика <span aria-hidden="true">*</span></label>
            <input id="student-name" name="studentName" type="text" autocomplete="name" required aria-describedby="student-name-error" />
            <p class="field-error" id="student-name-error"></p>
          </div>
          <div class="field">
            <label for="birth-date">Дата рождения <span aria-hidden="true">*</span></label>
            <div class="birth-date-field">
              <input id="birth-date" name="birthDate" type="text" inputmode="none" placeholder="Выберите дату" readonly required aria-haspopup="dialog" aria-controls="birth-date-dialog" aria-describedby="birth-date-error" />
              <button class="birth-date-trigger" id="birth-date-trigger" type="button" aria-label="Выбрать дату рождения" aria-haspopup="dialog" aria-controls="birth-date-dialog">▦</button>
            </div>
            <p class="field-error" id="birth-date-error"></p>
          </div>
          <div class="field">
            <label for="guardian-name">Имя родителя / опекуна <span aria-hidden="true">*</span></label>
            <input id="guardian-name" name="guardianName" type="text" autocomplete="name" required aria-describedby="guardian-name-error" />
            <p class="field-error" id="guardian-name-error"></p>
          </div>
          <div class="field">
            <label for="phone">Телефон <span aria-hidden="true">*</span></label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+996 555 123 456" required aria-describedby="phone-error" />
            <p class="field-error" id="phone-error"></p>
          </div>
          <div class="field">
            <label for="program">Программа обучения <span aria-hidden="true">*</span></label>
            <select id="program" name="program" required aria-describedby="program-error">
              <option value="">Выберите программу</option>
              <option>Начальный уровень</option>
              <option>Основная программа</option>
              <option>Изучение Корана</option>
              <option>Арабский язык</option>
            </select>
            <p class="field-error" id="program-error"></p>
          </div>
          <div class="field full-width">
            <label for="comment">Комментарий <span class="optional">необязательно</span></label>
            <textarea id="comment" name="comment" rows="3" placeholder="Например, удобное время для звонка"></textarea>
          </div>
        </div>
        <div class="consent field">
          <input id="consent" name="consent" type="checkbox" required aria-describedby="consent-error" />
          <label for="consent">Я согласен(на) на обработку персональных данных для рассмотрения заявки. <span aria-hidden="true">*</span></label>
        </div>
        <p class="field-error" id="consent-error"></p>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        <button class="button submit-button" type="submit">Отправить заявку <span aria-hidden="true">→</span></button>
        <p class="privacy-note">Данные передаются только защищённому серверу для рассмотрения заявки.</p>
      </form>
      <dialog class="date-picker-dialog" id="birth-date-dialog" aria-labelledby="date-picker-title">
        <section class="date-picker-sheet">
          <header class="date-picker-header"><div class="date-picker-grabber" aria-hidden="true"></div><h2 id="date-picker-title">Дата рождения</h2><button class="date-picker-close" id="birth-date-cancel" type="button">Отмена</button></header>
          <div class="date-picker-columns" aria-label="Выбор дня, месяца и года">
            <div class="date-picker-column"><span>День</span><div class="date-wheel" id="birth-day-wheel" role="listbox" tabindex="0" aria-label="День"></div></div>
            <div class="date-picker-column"><span>Месяц</span><div class="date-wheel" id="birth-month-wheel" role="listbox" tabindex="0" aria-label="Месяц"></div></div>
            <div class="date-picker-column"><span>Год</span><div class="date-wheel" id="birth-year-wheel" role="listbox" tabindex="0" aria-label="Год"></div></div>
          </div>
          <p class="date-picker-preview" id="birth-date-preview" aria-live="polite"></p>
          <button class="button date-picker-confirm" id="birth-date-confirm" type="button">Выбрать дату</button>
        </section>
      </dialog>
    </main>
    <script src="/app.js"></script>
    <script src="/site-nav.js"></script>
  </body>
</html>
