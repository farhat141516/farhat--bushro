<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Админ-панель — Ал Бушра</title><link rel="stylesheet" href="/styles.css" /></head>
<body><header class="page-header"><nav class="nav container"><a class="brand" href="http://localhost:3000/"><span class="brand-mark" aria-hidden="true">أ</span><span>Ал Бушра<small>админ-панель</small></span></a><button class="button button-small" id="logout-button" type="button">Выйти</button></nav></header><main class="inner-page container admin-page"><div class="admin-heading"><div><p class="eyebrow">Только для администратора</p><h1>Управление медресе</h1></div></div><section class="admin-panel"><h2>Иконки разделов</h2><form id="content-form" class="admin-controls"><label>Иконка «О медресе» <input id="about-icon" maxlength="8" /></label><label>Иконка «Устазы» <input id="teachers-icon" maxlength="8" /></label><label>Иконка «Хафизы» <input id="hafiz-icon" maxlength="8" /></label><label>Иконка «Алимы» <input id="alim-icon" maxlength="8" /></label><label>Иконка «Среда» <input id="benefit1-icon" maxlength="8" /></label><label>Иконка «Развитие» <input id="benefit2-icon" maxlength="8" /></label><label>Иконка «Внимание» <input id="benefit3-icon" maxlength="8" /></label><button class="button" type="submit">Сохранить иконки</button><p class="form-status" id="content-status" role="status"></p></form></section><section class="admin-panel"><h2>Устазы</h2><div class="teacher-editor"><div><h3>Хафизы</h3><div id="hafiz-editor"></div><button class="button button-small" data-add-teacher="hafiz" type="button">Добавить хафиза</button></div><div><h3>Алимы</h3><div id="alim-editor"></div><button class="button button-small" data-add-teacher="alim" type="button">Добавить алима</button></div></div><button class="button" id="save-teachers" type="button">Сохранить список устазов</button><p class="form-status" id="teachers-status" role="status"></p></section><section class="admin-panel"><h2>Фотографии медресе</h2><input id="photo-upload" type="file" accept="image/jpeg,image/png,image/webp" multiple /><p class="upload-note">До 6 файлов, каждый не больше 8 МБ.</p><div class="admin-photo-grid" id="admin-photo-grid"></div><button class="button" id="save-photos" type="button">Сохранить фотографии</button><p class="form-status" id="photo-status" role="status"></p></section><section class="admin-panel"><div class="panel-title"><h2>Заявки</h2><button class="button button-small" id="refresh-applications" type="button">Обновить</button></div><div id="applications-list" class="applications-list"></div><p class="form-status" id="applications-status" role="status"></p></section></main><script src="/admin.js"></script></body></html>
